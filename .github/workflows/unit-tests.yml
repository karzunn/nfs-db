name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          python -m coverage run --source=nfs_db -m unittest discover -s tests -v
          python -m coverage report --fail-under=100
